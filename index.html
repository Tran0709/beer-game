function bindPlayEvents() {
  if (state.localRole && state.localRole !== 'facilitator') {
    const view = getMyRoleState();
    if (view && view.own) maybeAlertBacklog(view.week, view.own.backlog);
  }
  bindCursorTrackingOnce();
  const submitOrderBtn = document.getElementById('submitOrderBtn');
  if (submitOrderBtn) submitOrderBtn.addEventListener('click', () => {
    const view = getMyRoleState();
    const val = view.isFixedOrderWeek ? FIXED_ORDER_QTY : Number(document.getElementById('orderInput').value) || 0;
    submitDecision(val);
  });
  // broadcast this role's in-progress (not-yet-submitted) draft value, throttled,
  // so the team's Facilitator can watch live while everyone is still deciding;
  // read-only on their end; this never changes what actually gets submitted.
  const orderInputEl = document.getElementById('orderInput');
  if (orderInputEl && state.mode === 'multiplayer') {
    orderInputEl.addEventListener('input', () => {
      state.draftOrder = orderInputEl.value;
      broadcastDraftThrottled(orderInputEl.value);
    });
  }
  const submitDemandBtn = document.getElementById('submitDemandBtn');
  if (submitDemandBtn) submitDemandBtn.addEventListener('click', () => {
    const view = getMyRoleState();
    const val = view.isFixedOrderWeek ? FIXED_ORDER_QTY : Math.max(0, Number(document.getElementById('demandInput').value) || 0);
    submitDecision(val);
  });
  const randomDemandBtn = document.getElementById('randomDemandBtn');
  if (randomDemandBtn) randomDemandBtn.addEventListener('click', () => {
    const input = document.getElementById('demandInput');
    const game = getMyGame();
    const week = game ? game.week : 1;
    const suggested = computeSuggestedDemand(week);
    input.value = suggested;
    state.draftDemand = suggested;
    render();
  });
  const globalNewsSelect = document.getElementById('globalNewsSelect');
  if (globalNewsSelect) globalNewsSelect.addEventListener('change', () => setActiveGlobalNews(globalNewsSelect.value || null));
  document.querySelectorAll('.local-news-role-select').forEach(sel => {
    sel.addEventListener('change', () => setActiveLocalNews(sel.dataset.role, sel.value || null));
  });
  document.querySelectorAll('.followable-row').forEach(row => {
    row.addEventListener('click', () => {
      const teamIndex = Number(row.dataset.followTeam);
      const role = row.dataset.followRole;
      const cur = state.facilitatorFollowing;
      const isSame = cur && cur.teamIndex === teamIndex && cur.role === role;
      state.facilitatorFollowing = isSame ? null : { teamIndex, role };
      render();
    });
  });
  const unfollowBtn = document.getElementById('unfollowBtn');
  if (unfollowBtn) unfollowBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.facilitatorFollowing = null;
    render();
  });
  const forceBtn = document.getElementById('forceAdvanceBtn');
  if (forceBtn) forceBtn.addEventListener('click', () => resolveSessionWeek(true));
  const restartBtn = document.getElementById('restartBtnHud');
  if (restartBtn) restartBtn.addEventListener('click', () => restartSolo());
}

function submitDecision(value) {
  if (state.mode === 'solo') {
    stopTimer(); // manual submit: cancel whatever was left of this week's timer before it can fire late
    const decisions = {};
    decisions[state.localRole] = value;
    state.game.processWeek(decisions);
    maybeAutoPickNews(state.game.week);
    state.draftOrder = ''; state.draftDemand = '';
    state.screen = state.game.gameOver ? 'end' : 'play';
    if (!state.game.gameOver && state.soloTimerSeconds > 0) startTimer();
    render();
    return;
  }
  // multiplayer
  if (state.multiplayerRole === 'guest') {
    state.transport.send({ type: 'submit_decision', teamIndex: state.localTeamIndex, role: state.localRole, value });
    if (state.localRole === 'facilitator') state.facilitatorDone = true;
    state.waitingForOthers = true;
    render();
    return;
  }
  // host (whether or not they also occupy a seat)
  if (state.localRole === 'facilitator') {
    state.pendingHostDecisions.facilitator = value;
    state.facilitatorDone = true;
    state.transport.send({ type: 'facilitator_status', done: true });
    state.waitingForOthers = true;
    broadcastProgress();
    scheduleBotActivityForWeek(); // Retailer's turn may have just opened
    render();
    maybeResolveSessionWeek();
  } else if (state.localTeamIndex != null) {
    state.pendingHostDecisions[state.localTeamIndex + ':' + state.localRole] = value;
    state.waitingForOthers = true;
    broadcastProgress();
    render();
    maybeResolveSessionWeek();
  }
}

  return `

        <h3>💵 Cost Comparison: All 4 Roles</h3>

        <h3>The Bullwhip Effect: Orders Placed Each Week</h3>

    </div>
  </div>`;
}

function drawEndBarChart() {
  const canvas = document.getElementById('endBarChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return; // defensive: canvas 2D context unavailable in this environment
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const game = getMyGame();
  const results = game.finalResults;
  const baseline = game.baseline;
  const maxCost = Math.max(...results.map(r => r.totalCost), ...CHAIN.map(r => baseline.perRole[r]), 1);
  const padding = 50, chartH = H - padding - 30;
  const barW = (W - padding * 1.5) / results.length - 20;
  results.forEach((r, i) => {
    const barH = (r.totalCost / maxCost) * chartH;
    const x = padding + i * ((W - padding * 1.5) / results.length) + 10;
    const y = H - 30 - barH;
    ctx.fillStyle = ROLE_BAR_COLOR[r.role] || '#E0A94A';
    ctx.fillRect(x, y, barW, barH);
    ctx.fillStyle = '#F2E8D5';
    ctx.font = 'bold 13px Calibri, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fmtDollar(r.totalCost), x + barW / 2, y - 8);
    // baseline marker: dashed line at that role's baseline height
    const baseH = (baseline.perRole[r.role] / maxCost) * chartH;
    const baseY = H - 30 - baseH;
    ctx.save();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = '#A8987B';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 4, baseY); ctx.lineTo(x + barW + 4, baseY); ctx.stroke();
    ctx.restore();
    ctx.font = '12px Calibri, sans-serif';
    ctx.fillStyle = '#F2E8D5';
    ctx.fillText(ROLE_LABELS[r.role].replace(' (Facilitator)', ''), x + barW / 2, H - 12);
  });
  ctx.strokeStyle = 'rgba(242,232,213,0.3)';
  ctx.beginPath(); ctx.moveTo(padding - 10, H - 30); ctx.lineTo(W - 10, H - 30); ctx.stroke();
}

function bindEndEvents() {
  const currentGame = getMyGame();
  if (currentGame && state.lastCelebratedGame !== currentGame) {
    state.lastCelebratedGame = currentGame;
    playCelebrationSound();
  }
  document.getElementById('restartEndBtn').addEventListener('click', () => {
    if (state.mode === 'solo') { restartSolo(); return; }
    stopTimer();
    if (state.transport) state.transport.close();
    Object.assign(state, {
      screen: 'modeSelect', mode: null, localRole: null, localTeamIndex: null, multiplayerRole: null, transport: null,
      lobby: null, teams: null, game: null, pendingHostDecisions: {}, facilitatorDone: false, waitingForOthers: false, isAdminHost: false,
      facilitatorFollowing: null, liveDrafts: {}, liveCursors: {}, lastClicks: {},
    });
    render();
  });
  const menuBtn = document.getElementById('menuEndBtn');
  if (menuBtn) menuBtn.addEventListener('click', () => {
    stopTimer();
    Object.assign(state, { screen: 'modeSelect', mode: null, localRole: null, game: null, facilitatorFollowing: null, liveDrafts: {}, liveCursors: {}, lastClicks: {} });
    render();
  });
}

function guideSection(title, body) { return `<div class="guide-section"><h4>${title}</h4><p>${body}</p></div>`; }
function guideRoleList() {
  const roles = [
    { icon: '🏪', name: 'Retailer', body: 'The seller closest to the customer, think of a corner shop. You feel real, sometimes-unpredictable consumer demand first-hand. Nobody else in the chain finds out about it until they see how you react to it.' },
    { icon: '🏬', name: 'Wholesaler', body: 'You supply retailers in bulk. You never see the actual end consumer, only the orders the Retailer places with you, which are already one step removed from real demand.' },
    { icon: '🚚', name: 'Distributor', body: 'You supply wholesalers across a wider region. You\u2019re two steps removed from the end consumer, reacting entirely to the order pattern passed up from the Wholesaler.' },
    { icon: '🏭', name: 'Manufacturer', body: 'You\u2019re the brewery itself, the source of supply. You\u2019re the furthest from the end consumer, which means you\u2019re also the most exposed to swings that have been amplified by everyone downstream of you.' },
    { icon: '🧑\u200d🍺', name: 'Facilitator', body: 'You sit outside the cost competition entirely. You decide how much beer people actually want each week: the real demand signal everything else in the chain is reacting to. In multiplayer, the other four roles on your team wait for you to submit before they can order.' },
  ];
  return `<div class="guide-role-list">${roles.map(r => `
    <div class="guide-role-row">
      <span class="guide-role-icon">${r.icon}</span>
      <div class="guide-role-text"><b>${r.name}</b><p>${r.body}</p></div>
    </div>`).join('')}</div>`;
}
function renderGuideContent() {
  return `
  ${guideSection('🎯 Objective', 'Minimize your own total cost over the session. Cost is the holding cost per unit of stock you\'re holding, plus the stockout cost per unit you\'re short (backlogged), added up every week. Both are configurable by whoever sets up the game.')}
  ${guideSection('🔗 The Chain', 'Four roles form a line: Retailer → Wholesaler → Distributor → Manufacturer. Each orders from the one upstream of it. A fifth role, the Facilitator, drives real demand at the Retailer end.')}
  <div class="guide-section">
    <h4>👥 The Five Roles, Explained</h4>
    ${guideRoleList()}
  </div>
  ${guideSection('🙈 Hidden Information', 'You only ever see your own stock, backlog, and the order you just received from downstream. You cannot see anyone else\'s numbers. That\'s deliberate: it\'s what causes the bullwhip effect.')}
  ${guideSection('📦 Weeks 1-2', 'Every role\'s order is fixed at 4 units, no decisions yet. This just primes the pipeline to a steady state before the real exercise begins.')}
  ${guideSection('🚚 Lead Time', 'Every order takes 2 weeks to arrive as a shipment once it\'s placed. Plan ahead: what you order this week won\'t help you for two more weeks.')}
  ${guideSection('📊 Market Scenario', 'Before you start, click one of the four Market Scenario icons (Stable, Rising Costs, Supply Shock, or Efficient Chain) to open its settings: a base supply and demand, plus one scenario-specific field. This also sets the session\'s holding and stockout costs.')}
  ${guideSection('💡 Suggested Demand', 'Each week, the Facilitator can click Suggested to fill in a demand number informed by the chosen Market Scenario, then edit it freely before submitting. It is a starting point, never a requirement.')}
  ${guideSection('⏱️ Decision Timer', 'Optionally set a timer (up to 5 minutes per week) when setting up a game, solo or multiplayer. If time runs out before you submit, that week resolves automatically with an AI-assisted decision standing in for you, just for that turn. You can always type 00:00 for no timer, or force-advance a week manually.')}
  ${guideSection('👥 Multiplayer Room', 'A room seats 5 people: the 4 chain roles (Retailer, Wholesaler, Distributor, Manufacturer) plus one Facilitator. The host can see everyone\'s submission progress and move players between roles before kickoff.')}
  ${guideSection('👁️ Facilitator: Follow a Role', 'As the Facilitator, click any role in your Full Chain View to follow them closely: their stock, backlog, and cost history update live as the week plays out. In multiplayer, you can also see what everyone on your team is currently typing before they submit. All of this is view-only; you can never edit or submit on someone else\'s behalf.')}
  ${guideSection('📏 Baseline', 'The results screen compares your actual cost against a baseline: what it would have cost if every role had simply passed orders through unchanged, with zero reaction. The gap between the two is the real cost of the bullwhip effect.')}
  ${guideSection('🏆 Winning', 'After the final week, whoever has the lowest total cost among the 4 supply-chain roles on their team wins. The bar chart at the end compares all four directly, against the baseline.')}`;
}
function quitGame() {
  stopTimer();
  clearBotActivity();
  if (state.mode === 'multiplayer' && state.transport) {
    if (state.multiplayerRole === 'guest') releaseSeat();
    state.transport.close();
  }
  Object.assign(state, {
    screen: 'start', mode: null, localRole: null, localTeamIndex: null, multiplayerRole: null, transport: null,
    lobby: null, teams: null, game: null, pendingHostDecisions: {}, facilitatorDone: false, waitingForOthers: false,
    joinError: null, connectionError: null, isAdminHost: false, moveModeFrom: null, facilitatorFollowing: null, liveDrafts: {}, liveCursors: {}, lastClicks: {},
    settingsOpen: false,
  });
  render();
}
function canRestartFromSettings() {
  if (state.mode === 'solo') return !!state.lastSoloConfig;
  if (state.mode === 'multiplayer') return state.multiplayerRole === 'host' && !!state.teams;
  return false;
}
function restartFromSettings() {
  state.settingsOpen = false;
  if (state.mode === 'solo') { restartSolo(); return; }
  if (state.mode === 'multiplayer' && state.multiplayerRole === 'host') { startHostedGame(); return; }
}
function renderSettingsPanel() {
  const root = document.getElementById('settingsPanelRoot') || (() => {
    const d = document.createElement('div'); d.id = 'settingsPanelRoot'; document.body.appendChild(d); return d;
  })();
  const open = !!state.settingsOpen;
  const canRestart = canRestartFromSettings();
  root.innerHTML = `
    <button id="settingsGearBtn" class="settings-gear-btn" title="Settings">⚙️</button>
    ${open ? `
    <div class="settings-dropdown" id="settingsDropdown">
      <button class="settings-item" id="settingsSoundBtn">${state.soundMuted ? '🔇' : '🔊'} ${state.soundMuted ? 'Unmute Sound' : 'Mute Sound'}</button>
      <button class="settings-item" id="settingsHelpBtn">📖 Help &amp; Guide</button>
      <button class="settings-item" id="settingsRestartBtn" ${canRestart ? '' : 'disabled'}>🔄 Restart${canRestart ? '' : ' <span class="opt-tag">(no active game)</span>'}</button>
      <button class="settings-item settings-item-danger" id="settingsQuitBtn">🚪 Quit to Start</button>
    </div>` : ''}`;
  document.getElementById('settingsGearBtn').addEventListener('click', (e) => { e.stopPropagation(); state.settingsOpen = !state.settingsOpen; render(); });
  if (open) {
    document.getElementById('settingsSoundBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
    document.getElementById('settingsHelpBtn').addEventListener('click', (e) => { e.stopPropagation(); state.settingsOpen = false; render(); showHelpModal(); });
    const restartBtn = document.getElementById('settingsRestartBtn');
    if (canRestart) restartBtn.addEventListener('click', (e) => { e.stopPropagation(); restartFromSettings(); });
    document.getElementById('settingsQuitBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.confirm('Quit to the start screen? Any progress in this game will be lost.')) quitGame();
    });
    setTimeout(() => {
      document.addEventListener('click', (e) => {
        if (!root.contains(e.target)) { state.settingsOpen = false; render(); }
      }, { once: true });
    }, 0);
  }
}
function showHelpModal() {
  const root = document.getElementById('helpModalRoot') || (() => {
    const d = document.createElement('div'); d.id = 'helpModalRoot'; document.body.appendChild(d); return d;
  })();
  root.innerHTML = `
  <div class="modal-overlay" id="helpOverlay">
    <div class="modal help-modal">
      <h2>🍺 How to Play: The Beer Game</h2>
      <div class="modal-section">
        <h4>Video Walkthrough</h4>
        <video class="guide-video" controls playsinline preload="metadata">
          <source src="data:video/mp4;base64,${HOW_TO_PLAY_VIDEO_BASE64}" type="video/mp4" />
          Your browser doesn't support embedded video. The written guide below covers the same steps.
        </video>
      </div>
      <div class="modal-section guide-body">${renderGuideContent()}</div>
      <button class="btn-primary btn-block" id="closeHelpBtn">Close Guide</button>
    </div>
  </div>`;
  document.getElementById('closeHelpBtn').addEventListener('click', closeHelpModal);
  document.getElementById('helpOverlay').addEventListener('click', (e) => { if (e.target.id === 'helpOverlay') closeHelpModal(); });
}
function closeHelpModal() {
  const root = document.getElementById('helpModalRoot');
  if (root) root.innerHTML = '';
}

window.state = state;
window.render = render;
window.startSolo = startSolo;
window.hostRoom = hostRoom;
window.joinRoom = joinRoom;
window.claimSeat = claimSeat;
window.moveSeat = moveSeat;
window.startHostedGame = startHostedGame;
window.submitDecision = submitDecision;
window.resolveSessionWeek = resolveSessionWeek;
window.showHelpModal = showHelpModal;
document.addEventListener('DOMContentLoaded', render);
if (document.readyState !== 'loading') render();
</script></body></html>
